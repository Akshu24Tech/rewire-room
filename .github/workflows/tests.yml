name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Check brain prose for em dashes (sources.md is verbatim data, skip it)
        run: |
          for brain in .claude/skills/rewire/brains/*/; do
            [ -f "$brain/_hot.md" ] || continue
            for f in "$brain"*.md; do
              [ "$(basename "$f")" = "sources.md" ] && continue
              if grep -n "—" "$f"; then echo "Em dash in $f"; exit 1; fi
            done
          done
